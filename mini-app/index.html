<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e1621" />
  <title>Taskcoin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- ═══ Home / Dashboard ═══ -->
    <section class="view is-active" id="view-home" data-view="home">

      <header class="header">
        <div class="header__brand">
          <span class="header__logo">🪙</span>
          <span class="header__name">Taskcoin</span>
        </div>
        <span class="header__badge" id="connection-badge" hidden>
          <span class="header__badge-dot"></span>
          <span id="connection-label">متصل</span>
        </span>
      </header>

      <!-- Balance Card -->
      <section class="balance">
        <div class="balance__top">
          <span class="balance__caption">الرصيد الحالي</span>
          <span class="balance__chip" id="balance-trend">▲ أسبوع جيد</span>
        </div>
        <div class="balance__amount" id="balance-amount">—</div>
        <div class="balance__meta">
          <span id="balance-points">—</span>
          <span class="balance__sep">•</span>
          <span>محفظة USD</span>
        </div>
        <div class="balance__actions">
          <button class="balance__btn balance__btn--primary" type="button">＋ شحن</button>
          <button class="balance__btn" type="button">💸 سحب</button>
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="section">
        <h2 class="section__title">إجراءات سريعة</h2>
        <div class="quick" id="quick-actions"><!-- rendered by app.js --></div>
      </section>

      <!-- Activity -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">النشاط الأخير</h2>
          <span class="section__hint" id="activity-count"></span>
        </div>
        <div class="activity card" id="activity-list"><!-- rendered by app.js --></div>
      </section>

    </section>

    <!-- ═══ Tasks (placeholder) ═══ -->
    <section class="view" id="view-tasks" data-view="tasks">
      <div class="placeholder card">
        <div class="placeholder__icon">🎯</div>
        <h2 class="placeholder__title">المهام</h2>
        <p class="placeholder__text">قائمة المهام ستظهر هنا قريبًا.</p>
      </div>
    </section>

    <!-- ═══ Invite (placeholder) ═══ -->
    <section class="view" id="view-invite" data-view="invite">
      <div class="placeholder card">
        <div class="placeholder__icon">👥</div>
        <h2 class="placeholder__title">دعوة الأصدقاء</h2>
        <p class="placeholder__text">رابط الدعوة الخاص بك سيظهر هنا قريبًا.</p>
      </div>
    </section>

    <!-- ═══ Profile (placeholder) ═══ -->
    <section class="view" id="view-profile" data-view="profile">
      <div class="placeholder card">
        <div class="placeholder__icon">👤</div>
        <h2 class="placeholder__title">حسابي</h2>
        <p class="placeholder__text">ملفك الشخصي وإعداداتك ستظهر هنا قريبًا.</p>
      </div>
    </section>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bottom-nav__item is-active" data-nav="home" type="button">
        <span class="bottom-nav__icon">🏠</span>
        <span class="bottom-nav__label">الرئيسية</span>
      </button>
      <button class="bottom-nav__item" data-nav="tasks" type="button">
        <span class="bottom-nav__icon">🎯</span>
        <span class="bottom-nav__label">المهام</span>
      </button>
      <button class="bottom-nav__item" data-nav="invite" type="button">
        <span class="bottom-nav__icon">👥</span>
        <span class="bottom-nav__label">الدعوات</span>
      </button>
      <button class="bottom-nav__item" data-nav="profile" type="button">
        <span class="bottom-nav__icon">👤</span>
        <span class="bottom-nav__label">حسابي</span>
      </button>
    </nav>

  </main>

  <script src="app.js"></script>
</body>
</html>

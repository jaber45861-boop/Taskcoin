<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e1621" />
  <title>Taskcoin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">

    <header class="shell__header">
      <div class="shell__brand">
        <span class="shell__logo">🪙</span>
        <div class="shell__titles">
          <h1 class="shell__title">Taskcoin</h1>
          <p class="shell__subtitle">اكسب من مهام بسيطة</p>
        </div>
      </div>
      <span class="shell__connection" id="connection-badge" hidden>
        <span class="shell__connection-dot"></span>
        <span id="connection-label">متصل</span>
      </span>
    </header>

    <section class="hero card">
      <div class="hero__icon">🎁</div>
      <h2 class="hero__title">شاهد واربح من التطبيق</h2>
      <p class="hero__text">
        هذه نسخة أولية من التطبيق. المحتوى التفاعلي سيظهر هنا عند توفره.
      </p>
    </section>

    <section class="card card--muted">
      <h3 class="card__heading">جاهز للتوسعة</h3>
      <ul class="card__list">
        <li>واجهة مدمجة مع ثيم تيليجرام تلقائيًا</li>
        <li>دعم كامل للعربية واتجاه RTL</li>
        <li>عرض متجاوب لجميع الشاشات</li>
      </ul>
    </section>

    <footer class="shell__footer">
      <p>Taskcoin Mini App</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
